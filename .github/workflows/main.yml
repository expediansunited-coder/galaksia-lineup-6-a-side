name: Line-up Generator

on:
  schedule:
    - cron: '0 7 * * *'   # ~09:00 Prague summer / 08:00 winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secret files
        run: |
          echo '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.META_CONFIG_6ASIDE_JSON }}' > meta_config_6aside.json

      - name: Generate images
        run: python "Line Up 6-a-side.py" --generate-only

      - name: Commit generated images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/*.png 2>/dev/null || echo "no images to add"
          git commit -m "Add generated line-up images" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Post to Meta
        run: python "Line Up 6-a-side.py" --post-only

      - name: Remove generated images
        run: |
          git rm -f output/*.png 2>/dev/null || echo "nothing to remove"
          git commit -m "Clean up line-up images" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
